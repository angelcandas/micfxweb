name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Engine, type-check, build, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the desktop core and JUCE
        run: bash scripts/fetch-deps.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.1
          actions-cache-folder: emsdk-cache
      - run: pnpm install --frozen-lockfile
      - name: Build the engine (desktop DSP to wasm)
        run: pnpm --filter @micfx/engine build
      - run: pnpm typecheck
      - run: pnpm build
      - name: Install Chromium for the browser tests
        run: pnpm --filter @micfx/voice exec playwright install --with-deps chromium
      - run: pnpm test
        env:
          CI: true
