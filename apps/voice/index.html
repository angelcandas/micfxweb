<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MicFX Voice: live voice effects for your microphone, in the browser.">
  <title>MicFX Voice</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="arc-gradient" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#8c7bff" />
            <stop offset="1" stop-color="#3fd9c6" />
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="9" fill="url(#arc-gradient)" />
        <path d="M7 16h2.5l2-6 3 12 3-15 3 13 2-4H25" fill="none" stroke="#0c0e13" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div>
        <h1>MicFX Voice</h1>
        <p class="subtitle">Live voice effects in your browser</p>
      </div>
    </div>
    <div class="status" aria-live="polite">
      <span class="latency" title="Estimated time from your voice reaching the mic to hearing it back">—</span>
    </div>
  </header>

  <main id="app">
    <section class="power">
      <button class="start" type="button">Start mic</button>
      <p class="hint">Use wired headphones: speakers feed back into the mic, and Bluetooth adds too much delay to sing with.</p>
      <p class="error" hidden></p>
    </section>

    <section class="meters" aria-label="Levels">
      <div class="meter"><span>In</span><div class="bar"><div class="fill" data-meter="input"></div></div></div>
      <div class="meter"><span>Out</span><div class="bar"><div class="fill" data-meter="output"></div></div></div>
    </section>

    <section class="controls" aria-label="Effects">
      <div class="effects"></div>
      <div class="gains">
        <label>Input <input type="range" min="-24" max="24" step="0.5" value="0" data-value="inputGain"><output>0 dB</output></label>
        <label>Output <input type="range" min="-24" max="24" step="0.5" value="0" data-value="outputGain"><output>0 dB</output></label>
      </div>
      <button class="dry" type="button" title="Hold to hear your voice without effects (or hold D)">Hold for dry</button>
    </section>
  </main>

  <footer>
    <a href="https://github.com/angelcandas/micfxweb">Source code</a> · Effects from the MicFX desktop app, running in WebAssembly.
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
